name: Backend CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16

        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: raglab_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U root -d raglab_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+psycopg://root:test_password@localhost:5432/raglab_test
      TEST_DATABASE_URL: postgresql+psycopg://root:test_password@localhost:5432/raglab_test

      # Dummy values because Clerk is mocked by our tests.
      CLERK_SECRET_KEY: sk_test_ci_placeholder
      CLERK_JWT_KEY: ci_test_placeholder
      CLERK_AUTHORIZED_PARTIES: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Enable pgvector
        run: |
          uv run python -c "
          import psycopg

          conn = psycopg.connect(
              'postgresql://root:test_password@localhost:5432/raglab_test',
              autocommit=True,
          )

          conn.execute(
              'CREATE EXTENSION IF NOT EXISTS vector'
          )

          conn.close()
          "

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: >
          uv run pytest
          --cov=app
          --cov-report=term-missing
          --cov-fail-under=85
